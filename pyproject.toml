[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saptadrishti"
version = "0.1.0"
description = "SaptaDrishti review-gate prototype"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.0", "pypdf>=4", "pymupdf>=1.24", "cryptography>=41"]

[project.optional-dependencies]
docx = ["python-docx>=1.1"]
test = ["pytest>=8"]

[project.scripts]
sd = "saptadrishti.cli:main"

[tool.setuptools]
packages = ["saptadrishti"]

[tool.setuptools.package-data]
saptadrishti = ["static/*.html"]
